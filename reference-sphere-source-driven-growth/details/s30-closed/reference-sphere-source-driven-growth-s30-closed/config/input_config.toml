[run]
dt = 0.00025
t_end = 0.12
component_steering = false
checkpoint_every = 0
checkpoint_at_end = true

[geometry]
shape = "sphere"
radius = 1.0
mesh_h = 0.075
u_degree = 1
scalar_degree = 1
quadrature_degree = 4

[[geometry.seeds]]
center = [-0.45, 0.0, 0.0]
radius = 0.3

[[geometry.seeds]]
center = [0.45, 0.0, 0.0]
radius = 0.3

[[geometry.seeds]]
center = [0.0, 0.45, 0.0]
radius = 0.3

[[geometry.seeds]]
center = [0.0, -0.45, 0.0]
radius = 0.3

[startup]
mode = "analytic"
relax_steps = 0
relax_dt = 0.001
pressure_gauge = "keep_offset"
growth_mode = "no-growth"

[physics]
ell = 0.15
gamma = 1.0
mobility = 0.5
permeability = 0.5
growth_phase = "tissue"
g0 = 1.0
g_rate = 2.5
g_max = 1.2
hydration_on = true
theta_eq_tissue = 0.03
theta_eq_lumen = 0.02
theta_eq_power = 1.0
osmotic_on = false
pi0 = 0.0
pi_power = 1.0
solid_prestretch_on = false
fs_tissue = 0.0
fs_lumen = 0.0
fs_power = 1.0
storage_modulus_tissue = 1.0
storage_modulus_lumen = 0.1
biot_alpha_tissue = 1.0
biot_alpha_lumen = 0.1
mu_elastic_coupling = 1.0
mu_storage_coupling = 1.0
mu_osmotic_coupling = 1.0
wall_strength = 8.0
wall_pref = -1.0
p_offset = 0.0
p_offset_lumen = false
source_pf = 30
source_theta = 0
source_region = "homogeneous"

[solver]
biot_split = "monolithic"
split_iters = 12
split_tol = 5.0e-6
aitken = true
outer_relaxation = 0.2
dt_retry = true
dt_min = 1.0e-6
dt_scale = 0.5
dt_max_retries = 5
dt_recovery_enable = true
dt_recovery_window_blocks = 2
dt_recovery_snap_mode = "nearest-grid"
dt_recovery_grid_tol = 1.0e-10
amr_enable = false
amr_every = 2
amr_threshold = 0.05
amr_max_events = 2
amr_mode = "reference"
amr_mass_correction = false
petsc_biot = ["snes_type=newtonls", "snes_linesearch_type=bt", "snes_max_it=40"]

[output]
run_name = "canonical_sphere_source_pf_only_closed_direct_start_s30_long"
output_dir = "output/mass-injecting-growth-sphere-probe"
write_every = 1
lumen_threshold = 0.5
frames = true
montage_frames = 5
make_movie = false

[boundary_conditions.hydraulic]
mode = "closed"
tag = 2
kappa = 0
p_ext = 0
use_effective_potential = false
pressure = 0

[scenario]
name = "canonical sphere source pf only closed direct start s30 long"
mechanism_tags = ["geometry:sphere", "source_driven", "hydraulic:closed", "pf_only", "direct_start", "exploratory_extension"]
biological_interpretation = "Longer-horizon continuation of the first-pass 3D sphere transfer for the disk-carried pf-only source lane."
key_observables = ["min_J", "max_pf", "J_fraction_ref_below_0_8", "J_p01_ref", "p_eff_range"]
model_setup = "Fixed-mesh four-cardinal-lumen sphere direct-start lane with pf-only source forcing, closed hydraulic boundary, conservative dt, and component steering disabled, extended to the disk-style horizon."
expected_dynamics = "Use only after the short-horizon probe shows an interpretable onset; the goal is to test whether the sphere branch recovers or accumulates mechanical and hydraulic stress over the longer horizon."
observation_guide = ["Restart this lane from the pilot checkpoint rather than treating it as a separate cold start.", "Compare the extension against the pilot package to see whether low-J extent recovers or spreads with time."]
